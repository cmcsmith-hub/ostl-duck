<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OSTL Duck Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="" crossorigin=""/>
  <!-- MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
    html,body,#map { height: 100%; margin: 0; padding: 0; }
    #map { min-height: 480px; }
    .popup-image { max-width: 240px; display:block; margin:6px 0; }
    .popup-meta { font-size: 0.9em; color:#333; margin-bottom:6px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="" crossorigin=""></script>
  <!-- MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
/* CONFIG: replace this with your Apps Script web app URL if different */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw8JjPqgC9pMQW05v3hccEl0luKmmaw_e85oSXnsk4dY7rXtWRSPCIWV-BmWRYs03k/exec';

const map = L.map('map').setView([37.8, -96], 4);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

// Create a marker cluster group. The options enable spiderfy on click,
// chunked loading for many markers, and avoid showing coverage polygon on hover.
const markers = L.markerClusterGroup({
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  maxClusterRadius: 50,
  chunkedLoading: true
});
map.addLayer(markers);

// Fetch sightings and add markers
async function loadSightings() {
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=sightings`);
    if (!res.ok) throw new Error('Fetch failed: ' + res.status);
    const data = await res.json();
    if (!Array.isArray(data)) return;

    data.forEach(s => {
      const lat = parseFloat(s.lat);
      const lon = parseFloat(s.lon);
      if (!isFinite(lat) || !isFinite(lon)) return;

      const popupParts = [];
      const ts = s.timestamp ? new Date(s.timestamp).toLocaleString() : '';
      if (ts) popupParts.push(`<div class="popup-meta"><strong>${ts}</strong></div>`);
      const place = (s.city || s.state) ? `<div class="popup-meta">${escapeHtml(s.city || '')} ${escapeHtml(s.state || '')}</div>` : '';
      if (place) popupParts.push(place);
      if (s.photo) popupParts.push(`<img class="popup-image" src="${escapeAttr(s.photo)}" alt="photo">`);
      if (s.notes) popupParts.push(`<div>${escapeHtml(s.notes)}</div>`);

      const popupContent = popupParts.join('');

      const marker = L.marker([lat, lon]);
      marker.bindPopup(popupContent || '(no details)');
      markers.addLayer(marker);
    });

    // If at least one marker, fit map bounds to all markers
    if (markers.getLayers().length) {
      const groupBounds = markers.getBounds();
      if (groupBounds.isValid()) map.fitBounds(groupBounds.pad(0.25));
    }

  } catch (err) {
    console.error('Error loading sightings:', err);
  }
}

// small helpers to avoid XSS injection into popups
function escapeHtml(s) {
  if (!s) return '';
  return String(s)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'", '&#39;');
}
function escapeAttr(s) {
  return escapeHtml(s).replaceAll('\n','');
}

loadSightings();
</script>
</body>
</html>
